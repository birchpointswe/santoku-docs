daemon {{nginx.daemon}};
pid {{nginx.pid}};
worker_processes {{nginx.workers}};
error_log {{nginx.error_log}} info;

events {}

http {

  include {{openresty_dir}}/nginx/conf/mime.types;

  access_log {{nginx.access_log}};

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml text/javascript application/json
    application/javascript application/xml application/wasm image/svg+xml;

  server {
    listen {{nginx.port}};
    listen [::]:{{nginx.port}};
    server_name {{nginx.domain}};

    location /.well-known/acme-challenge/ {
      root {{nginx.acme_root}};
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {

    server_name {{nginx.domain}};
    listen {{nginx.ssl_port}} ssl;
    listen [::]:{{nginx.ssl_port}} ssl;
    ssl_certificate {{nginx.ssl_cert}};
    ssl_certificate_key {{nginx.ssl_key}};
    ssl_protocols TLSv1.2 TLSv1.3;
    {{#nginx.hsts}}
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    {{/nginx.hsts}}

    location = / {
      limit_except GET { deny all; }
      root public;
      try_files /index.html =404;
      add_header Cache-Control 'no-cache';
    }

    location = /sitemap.xml {
      limit_except GET { deny all; }
      root public;
      try_files /sitemap.xml =404;
      add_header Cache-Control 'no-cache';
    }

    location = /llms.txt {
      limit_except GET { deny all; }
      root public;
      try_files /llms.txt =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location = /llms-full.txt {
      limit_except GET { deny all; }
      root public;
      try_files /llms-full.txt =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location = /setup-toku.sh {
      limit_except GET { deny all; }
      root public;
      try_files /setup-toku.sh =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location ~ "^/logo-[a-z0-9-]+\.png$" {
      limit_except GET { deny all; }
      root public;
      default_type image/png;
      add_header Cache-Control 'public, max-age=3600';
    }

    location = /logo.png {
      limit_except GET { deny all; }
      root public;
      try_files /logo.png =404;
      default_type image/png;
      add_header Cache-Control 'public, max-age=3600';
    }

    location = /logo.svg {
      limit_except GET { deny all; }
      root public;
      try_files /logo.svg =404;
      default_type image/svg+xml;
      add_header Cache-Control 'public, max-age=3600';
    }

    location ~* "\.[a-f0-9]{12}\." {
      limit_except GET { deny all; }
      root public;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      limit_except GET { deny all; }
      root public;
      try_files $uri $uri/index.html =404;
      add_header Cache-Control 'no-cache';
    }
  }
}
