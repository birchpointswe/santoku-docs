<% n = nginx.nginx %>
daemon <% return n.daemon %>;
pid <% return n.pid %>;
worker_processes <% return n.workers %>;
error_log <% return n.error_log %> info;

events {}

http {

  include <% return openresty_dir %>/nginx/conf/mime.types;

  access_log <% return n.access_log %>;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml text/javascript application/json
    application/javascript application/xml application/wasm image/svg+xml;

  server {
    listen <% return n.port %>;
    listen [::]:<% return n.port %>;
    server_name <% return n.domain %>;

    location /.well-known/acme-challenge/ {
      root <% return n.acme_root %>;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {

    server_name <% return n.domain %>;
    listen <% return n.ssl_port %> ssl;
    listen [::]:<% return n.ssl_port %> ssl;
    ssl_certificate <% return n.ssl_cert %>;
    ssl_certificate_key <% return n.ssl_key %>;
    ssl_protocols TLSv1.2 TLSv1.3;
    <% return n.hsts and
      "add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;"
      or "" %>

    location = / {
      limit_except GET { deny all; }
      root public;
      try_files /<% return hashed("index.html") %> =404;
      add_header Cache-Control 'no-cache';
    }

<%
  local out = {}
  for _, fp in ipairs(client.public_files) do
    local dir = string.match(fp, "^(.+)/index%.html$")
    if dir then
      out[#out + 1] = table.concat({
        "    location = /", dir, " {\n",
        "      limit_except GET { deny all; }\n",
        "      root public;\n",
        "      try_files /", hashed(fp), " =404;\n",
        "      add_header Cache-Control 'no-cache';\n",
        "    }\n",
      })
    end
  end
  table.sort(out)
  return table.concat(out, "\n")
%>

    location = /sitemap.xml {
      limit_except GET { deny all; }
      root public;
      try_files /sitemap.xml =404;
      add_header Cache-Control 'no-cache';
    }

    location = /llms.txt {
      limit_except GET { deny all; }
      root public;
      try_files /llms.txt =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location = /llms-full.txt {
      limit_except GET { deny all; }
      root public;
      try_files /llms-full.txt =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location = /setup-toku.sh {
      limit_except GET { deny all; }
      root public;
      try_files /setup-toku.sh =404;
      default_type text/plain;
      add_header Cache-Control 'no-cache';
    }

    location ~ "^/logo-[a-z0-9-]+\.png$" {
      limit_except GET { deny all; }
      root public;
      default_type image/png;
      add_header Cache-Control 'public, max-age=3600';
    }

    location = /logo.png {
      limit_except GET { deny all; }
      root public;
      try_files /logo.png =404;
      default_type image/png;
      add_header Cache-Control 'public, max-age=3600';
    }

    location = /logo.svg {
      limit_except GET { deny all; }
      root public;
      try_files /logo.svg =404;
      default_type image/svg+xml;
      add_header Cache-Control 'public, max-age=3600';
    }

    location ~* "\.[a-f0-9]{12}\." {
      limit_except GET { deny all; }
      root public;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      limit_except GET { deny all; }
      root public;
      try_files $uri =404;
      add_header Cache-Control 'no-cache';
    }
  }
}
